<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Temporary birthday site QA</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100vw;height:100vh;border:0}#results{position:fixed;left:0;bottom:0;max-height:28vh;max-width:100vw;overflow:auto;background:#fff;color:#111;z-index:99999;font:12px monospace}</style></head>
<body>
<iframe id="app" src="/"></iframe><pre id="results">RUNNING</pre>
<script>
const results=[];
const result=(name,pass,detail='')=>results.push({name,pass,detail});
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const waitFor=async(test,timeout=3000)=>{const end=Date.now()+timeout;while(Date.now()<end){if(test())return true;await sleep(50)}return false};
const frame=document.getElementById('app');
frame.addEventListener('load',async()=>{
  try {
    const w=frame.contentWindow,d=w.document;
    const active=()=>Array.from(d.querySelectorAll('.page')).filter(p=>p.classList.contains('active'));
    const check=(name,pass,detail='')=>result(name,Boolean(pass),detail);
    const checkActive=(expected)=>active().length===1&&active()[0].id===expected;
    check('Initial: four slides and one active',d.querySelectorAll('.page').length===4&&checkActive('page1'));
    const audio=d.getElementById('birthdayMusic'),musicButton=d.getElementById('musicToggle');
    check('Initial: selected audio source and paused',audio.querySelector('source')?.getAttribute('src')==='assets/music/song.mp3'&&audio.paused);
    const backgroundPaths=['forest-1.png','forest-2.png','forest-3.png'].every((name,index)=>w.getComputedStyle(d.getElementById(`page${index===2?3:index+1}`)).backgroundImage.includes(name));
    check('Forest background URLs configured',backgroundPaths);
    const start=d.getElementById('startButton');start.click();
    await sleep(850);
    check('Welcome click opens slide 2',checkActive('page2'));
    check('Navigation moves keyboard focus to slide heading',d.activeElement?.id==='page2-heading');
    await sleep(250);
    check('Music starts after welcome interaction',!audio.paused);
    musicButton.click();await sleep(80);
    check('Music pause control',audio.paused&&musicButton.getAttribute('aria-pressed')==='false');
    musicButton.click();await sleep(200);
    check('Music play control and accessible state',!audio.paused&&musicButton.getAttribute('aria-pressed')==='true');
    check('Music remains active during slide changes',!audio.paused);
    d.querySelector('#page2 [data-next]').click();await sleep(850);
    check('Slide 2 opens slide 3',checkActive('page3'));
    const photos=Array.from(d.querySelectorAll('#page3 .photo-grid img'));
    const photosLoaded=await waitFor(()=>photos.length===3&&photos.every(image=>image.naturalWidth>0),3500);
    check('All three gallery images load',photosLoaded,photos.map(image=>`${image.naturalWidth}x${image.naturalHeight}`).join(', '));
    const figures=Array.from(d.querySelectorAll('#page3 .photo-grid .photo-placeholder'));
    check('Memory 1 frame matches memory 2 frame',figures.length===3&&Math.abs(figures[0].offsetHeight-figures[1].offsetHeight)<=1,figures.map(figure=>figure.offsetHeight).join(', '));
    const leafCount=d.querySelectorAll('#leaves-container .falling-leaf').length;
    const bokehCount=d.querySelectorAll('#bokeh-container .bokeh:not(.wish-firefly)').length;
    check('Leaves and firefly field initialize',leafCount>0&&bokehCount>0,`${leafCount} leaves, ${bokehCount} lights`);
    const image=photos[0],imageFrame=image.closest('.photo-placeholder'),original=image.getAttribute('src');
    const broken=new Promise(resolve=>image.addEventListener('error',resolve,{once:true}));
    image.src='/__missing_photo_for_qa__.jpg';await Promise.race([broken,sleep(1800)]);
    check('Missing photo shows graceful fallback',imageFrame.classList.contains('image-missing')&&!imageFrame.classList.contains('image-loaded')&&w.getComputedStyle(image).display==='none');
    const restored=new Promise(resolve=>image.addEventListener('load',resolve,{once:true}));
    image.src=original;await Promise.race([restored,sleep(1800)]);
    check('Photo recovers after restoring its source',imageFrame.classList.contains('image-loaded'));
    d.querySelector('#page3 [data-next]').click();await sleep(850);
    check('Slide 3 opens slide 4',checkActive('page4'));
    d.getElementById('lightsButton').click();
    check('Finale fires once with temporary fireflies and sparkles',d.getElementById('lightsButton').disabled&&d.querySelectorAll('.wish-firefly').length===44&&d.querySelectorAll('.birthday-sparkle').length===24,`${d.querySelectorAll('.wish-firefly').length} fireflies, ${d.querySelectorAll('.birthday-sparkle').length} sparkles`);
    d.getElementById('replayButton').click();await sleep(850);
    check('Replay returns to slide 1 and clears finale',checkActive('page1')&&!d.querySelector('.wish-firefly')&&!d.querySelector('.birthday-sparkle')&&!d.getElementById('lightsButton').disabled);
    check('Replay leaves music playing',!audio.paused);
    d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await sleep(850);
    check('ArrowRight keyboard navigation',checkActive('page2'));
    d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));await sleep(850);
    check('ArrowLeft keyboard navigation',checkActive('page1'));
    for (const [label,width,height] of [['tablet',768,1024],['mobile',390,844],['narrow mobile',320,720],['landscape mobile',844,390]]) {
      frame.style.width=`${width}px`;frame.style.height=`${height}px`;await sleep(120);
      const overflow=Math.max(d.documentElement.scrollWidth,d.body.scrollWidth)-w.innerWidth;
      const title=d.querySelector('.page.active h1,.page.active h2');
      const titleOverflow=title?title.scrollWidth-title.clientWidth:0;
      check(`Responsive ${label}: no horizontal overflow`,overflow<=1,`overflow ${overflow}px at ${w.innerWidth}px`);
      check(`Responsive ${label}: active heading fits`,titleOverflow<=1,`heading overflow ${titleOverflow}px`);
    }
    document.getElementById('results').textContent=JSON.stringify(results,null,2);
  } catch(error) { document.getElementById('results').textContent=JSON.stringify({fatal:error.stack||String(error)},null,2); }
},{once:true});
</script>
</body></html>
